<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance Mode | Noble Dental Care – Nallagandla</title>

  <meta name="theme-color" content="#12B2A0">
  <link rel="icon" type="image/png" href="/images/logo-footer.webp">

  <!-- ✅ SEO Meta -->
  <meta name="description" content="We’re currently performing scheduled maintenance at Noble Dental Care. Please check back soon — your smile is always our priority.">
  <meta name="robots" content="noindex, follow">

  <!-- ✅ Open Graph -->
  <meta property="og:title" content="Maintenance Mode | Noble Dental Care – Nallagandla">
  <meta property="og:description" content="We’re updating our systems to serve you better. Please revisit shortly.">
  <meta property="og:image" content="/images/logo-footer.webp">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_IN">
  <meta property="og:url" content="https://nobledentalnallagandla.in/maintenance.html">

  <style>
    :root {
      --brand: #12B2A0;
      --text: #0f172a;
      --bg: #f6fafc;
      --radius: 12px;
    }
    body {
      margin: 0;
      font-family: "Manrope", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    img {
      width: 130px;
      margin-bottom: 24px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
    }
    h1 {
      color: var(--brand);
      font-size: 1.8rem;
      margin-bottom: 12px;
    }
    p {
      font-size: 1rem;
      max-width: 480px;
      line-height: 1.6;
      margin: 0 auto 8px;
    }
    .spinner {
      margin: 28px 0;
      width: 42px;
      height: 42px;
      border: 4px solid rgba(18,178,160,0.25);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      border-radius: var(--radius);
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.25s ease;
    }
    a:hover {
      background: #0d6efd;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(18,178,160,0.3);
    }
    footer {
      position: absolute;
      bottom: 12px;
      font-size: 0.85rem;
      color: #64748b;
    }
    @media (max-width: 480px) {
      h1 { font-size: 1.4rem; }
      img { width: 100px; }
    }
  </style>
</head>

<body>
  <img src="/images/logo-footer.webp" alt="Noble Dental Care Logo" loading="lazy">
  <h1>We’re Updating for You</h1>
  <div class="spinner" aria-hidden="true"></div>
  <p>Our website is temporarily down for maintenance as we enhance your digital experience.</p>
  <p>We’ll be back online shortly. Thank you for your patience and understanding.</p>
  <a href="/">🔁 Try Again</a>

  <footer>© 2025 Noble Dental Care – Nallagandla</footer>
</body>
</html>
