<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" style="background:#f9fbfc;font-family:Inter,sans-serif;">
  <!-- Central Node -->
  <circle cx="800" cy="500" r="80" fill="#00bfa5" />
  <text x="800" y="505" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">
    Noble Dental Care
  </text>

  <!-- Doctor Node -->
  <circle cx="1100" cy="350" r="60" fill="#00897b"/>
  <text x="1100" y="355" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">
    Dr. Dhivakaran
  </text>
  <line x1="860" y1="460" x2="1040" y2="370" stroke="#00796b" stroke-width="2" />

  <!-- Location Node -->
  <circle cx="500" cy="350" r="60" fill="#0091ea"/>
  <text x="500" y="355" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">
    Nallagandla
  </text>
  <line x1="740" y1="460" x2="540" y2="370" stroke="#0288d1" stroke-width="2"/>

  <!-- City Node -->
  <circle cx="400" cy="180" r="50" fill="#42a5f5"/>
  <text x="400" y="185" text-anchor="middle" font-size="13" fill="#fff">Hyderabad</text>
  <line x1="500" y1="300" x2="400" y2="230" stroke="#64b5f6" stroke-width="2"/>

  <!-- Services Node -->
  <circle cx="800" cy="750" r="70" fill="#26a69a"/>
  <text x="800" y="755" text-anchor="middle" font-size="16" fill="#fff" font-weight="600">
    Services
  </text>
  <line x1="800" y1="580" x2="800" y2="680" stroke="#00796b" stroke-width="2"/>

  <!-- Service Subnodes -->
  <circle cx="600" cy="850" r="45" fill="#80cbc4"/>
  <text x="600" y="855" text-anchor="middle" font-size="12" fill="#004d40">Root Canal</text>
  <line x1="740" y1="790" x2="630" y2="835" stroke="#009688" stroke-width="2"/>

  <circle cx="750" cy="900" r="45" fill="#80cbc4"/>
  <text x="750" y="905" text-anchor="middle" font-size="12" fill="#004d40">Implants</text>
  <line x1="780" y1="820" x2="760" y2="870" stroke="#009688" stroke-width="2"/>

  <circle cx="950" cy="850" r="45" fill="#80cbc4"/>
  <text x="950" y="855" text-anchor="middle" font-size="12" fill="#004d40">Braces</text>
  <line x1="860" y1="790" x2="930" y2="835" stroke="#009688" stroke-width="2"/>

  <circle cx="1000" cy="720" r="45" fill="#80cbc4"/>
  <text x="1000" y="725" text-anchor="middle" font-size="12" fill="#004d40">Whitening</text>
  <line x1="860" y1="700" x2="970" y2="720" stroke="#009688" stroke-width="2"/>

  <!-- Knowledge Node -->
  <circle cx="1150" cy="600" r="60" fill="#7e57c2"/>
  <text x="1150" y="605" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">Expertise</text>
  <line x1="860" y1="540" x2="1100" y2="580" stroke="#673ab7" stroke-width="2"/>

  <!-- Expertise Subnodes -->
  <circle cx="1280" cy="500" r="40" fill="#b39ddb"/>
  <text x="1280" y="505" text-anchor="middle" font-size="11" fill="#212121">Laser</text>
  <line x1="1190" y1="580" x2="1260" y2="520" stroke="#9575cd" stroke-width="2"/>

  <circle cx="1270" cy="650" r="40" fill="#b39ddb"/>
  <text x="1270" y="655" text-anchor="middle" font-size="11" fill="#212121">Pediatric</text>
  <line x1="1190" y1="620" x2="1240" y2="640" stroke="#9575cd" stroke-width="2"/>

  <!-- Online Presence -->
  <circle cx="500" cy="700" r="55" fill="#ffb300"/>
  <text x="500" y="705" text-anchor="middle" font-size="14" fill="#212121" font-weight="600">
    Social
  </text>
  <line x1="740" y1="560" x2="520" y2="680" stroke="#fbc02d" stroke-width="2"/>

  <!-- Platforms -->
  <circle cx="400" cy="820" r="40" fill="#ffe082"/>
  <text x="400" y="825" text-anchor="middle" font-size="11" fill="#333">Instagram</text>
  <line x1="480" y1="730" x2="420" y2="800" stroke="#ffca28" stroke-width="2"/>

  <circle cx="500" cy="860" r="40" fill="#ffe082"/>
  <text x="500" y="865" text-anchor="middle" font-size="11" fill="#333">Google Maps</text>
  <line x1="500" y1="740" x2="500" y2="840" stroke="#ffca28" stroke-width="2"/>

  <circle cx="600" cy="820" r="40" fill="#ffe082"/>
  <text x="600" y="825" text-anchor="middle" font-size="11" fill="#333">Facebook</text>
  <line x1="520" y1="730" x2="580" y2="800" stroke="#ffca28" stroke-width="2"/>
</svg>
