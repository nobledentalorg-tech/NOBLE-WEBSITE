<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Augmentin 625 DUO tablet pack illustration</title>
  <desc id="desc">Stylised blister pack showing Augmentin tablets and dosage details.</desc>
  <rect width="320" height="320" rx="32" fill="#f8fafc" />
  <g transform="translate(40 80)">
    <rect x="0" y="0" width="240" height="160" rx="24" fill="#e0e7ff" stroke="#312e81" stroke-width="4" />
    <rect x="20" y="24" width="200" height="48" rx="14" fill="#4338ca" />
    <text x="120" y="54" text-anchor="middle" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Augmentin 625 DUO</text>
    <text x="120" y="84" text-anchor="middle" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#312e81">Amoxicillin 500 mg + Clavulanic Acid 125 mg</text>
    <g transform="translate(36 104)">
      <g fill="#ede9fe">
        <rect x="0" y="0" width="56" height="36" rx="16" />
        <rect x="68" y="0" width="56" height="36" rx="16" />
        <rect x="136" y="0" width="56" height="36" rx="16" />
      </g>
      <g fill="#c4b5fd">
        <circle cx="28" cy="18" r="12" />
        <circle cx="96" cy="18" r="12" />
        <circle cx="164" cy="18" r="12" />
      </g>
    </g>
  </g>
  <text x="160" y="260" text-anchor="middle" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1e293b">Prescription only • 10 tablets</text>
</svg>
