name: Auto Compress + Update Sitemap Index + Ping SE

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"   # run daily at 3 AM UTC

jobs:
  compress:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compress sitemap files
        run: |
          mkdir -p compressed
          for file in sitemap.xml sitemap-services.xml sitemap-treatments.xml sitemap-news.xml sitemap-images.xml sitemap-locations.xml; do
            if [ -f "$file" ]; then
              echo "Compressing $file ..."
              gzip -9 -c "$file" > "compressed/$file.gz"
            else
              echo "Skipping $file (not found)"
            fi
          done

      - name: Move compressed files
        run: |
          cp compressed/*.gz . || true
          ls -lh *.gz || true

      - name: Update sitemap-index.xml
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap-index.xml
          echo '<sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap-index.xml
          for f in sitemap*.xml.gz; do
            [ -f "$f" ] || continue
            echo "  <sitemap>" >> sitemap-index.xml
            echo "    <loc>https://nobledentalnallagandla.in/$f</loc>" >> sitemap-index.xml
            echo "    <lastmod>$(date -u +%F)</lastmod>" >> sitemap-index.xml
            echo "  </sitemap>" >> sitemap-index.xml
          done
          echo '</sitemapindex>' >> sitemap-index.xml

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xml.gz sitemap-index.xml || true
          if git diff --cached --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "🤖 Auto-compress + update sitemap-index [skip ci]"
            git push
          fi

      - name: Upload compressed sitemaps (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: compressed-sitemaps
          path: compressed/*.gz

      - name: Ping Google & Bing
        run: |
          INDEX_URL="https://nobledentalnallagandla.in/sitemap-index.xml"
          echo "🔔 Pinging Google..."
          curl -s "http://www.google.com/ping?sitemap=$INDEX_URL" || true
          echo "🔔 Pinging Bing..."
          curl -s "http://www.bing.com/ping?sitemap=$INDEX_URL" || true
