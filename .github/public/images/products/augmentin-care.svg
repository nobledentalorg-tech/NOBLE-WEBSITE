<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Augmentin safety checklist illustration</title>
  <desc id="desc">Patient reviewing antibiotic safety checklist with clipboard and shield.</desc>
  <rect width="320" height="320" rx="32" fill="#fdf2f8" />
  <g transform="translate(60 60)">
    <rect x="0" y="0" width="200" height="200" rx="28" fill="#fee2e2" stroke="#f43f5e" stroke-width="3" />
    <rect x="24" y="28" width="152" height="16" rx="8" fill="#f43f5e" opacity="0.8" />
    <g transform="translate(32 72)" fill="#fda4af">
      <rect x="0" y="0" width="136" height="12" rx="6" />
      <rect x="0" y="24" width="136" height="12" rx="6" />
