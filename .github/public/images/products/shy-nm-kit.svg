<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Complete Shy NM sensitivity relief kit illustration</title>
  <desc id="desc">Foaming toothpaste tube with mouth tray, calendar, and timer showing 2 minutes to highlight routine.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#faffff"/>
      <stop offset="100%" stop-color="#dcf6ff"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="36" fill="#e4fbff"/>
  <rect x="28" y="48" width="264" height="224" rx="28" fill="url(#panel)" stroke="#aee7f5" stroke-width="4"/>
  <g transform="translate(70 88)">
    <rect x="16" y="0" width="72" height="140" rx="20" fill="#ffffff" stroke="#8bd7d5" stroke-width="3"/>
    <rect x="30" y="12" width="44" height="92" rx="12" fill="#12b2a0" opacity="0.12"/>
    <text x="52" y="58" font-family="'Manrope',sans-serif" font-weight="700" font-size="16" fill="#0f8a89" text-anchor="middle">SHY</text>
    <text x="52" y="80" font-family="'Manrope',sans-serif" font-weight="600" font-size="14" fill="#0f8a89" text-anchor="middle">NM</text>
    <rect x="36" y="140" width="32" height="20" rx="8" fill="#0f8a89"/>
  </g>
  <g transform="translate(160 94)">
    <path d="M0 60c0-24 20-44 44-44s44 20 44 44v6H0v-6z" fill="#12b2a0" opacity="0.12"/>
    <path d="M16 60c0-15 13-28 28-28s28 13 28 28v6H16v-6z" fill="#7cd6ce"/>
    <rect x="-6" y="66" width="108" height="32" rx="16" fill="#0f8a89"/>
    <text x="48" y="87" text-anchor="middle" font-family="'Manrope',sans-serif" font-weight="600" font-size="12" fill="#ffffff">Sensitivity mouth tray</text>
  </g>
  <g transform="translate(90 190)">
    <rect width="70" height="58" rx="16" fill="#ffffff" stroke="#12b2a0" stroke-width="2"/>
    <text x="35" y="30" text-anchor="middle" font-family="'Manrope',sans-serif" font-size="16" font-weight="700" fill="#0f8a89">2</text>
    <text x="35" y="46" text-anchor="middle" font-family="'Manrope',sans-serif" font-size="10" font-weight="600" fill="#0f8a89">Minutes</text>
  </g>
  <g transform="translate(180 188)">
