      <text x="50" y="0">Tue</text>
      <text x="84" y="0">Wed</text>
      <text x="16" y="20">Thu</text>
      <text x="50" y="20">Fri</text>
      <text x="84" y="20">Sat</text>
      <text x="16" y="40">Sun</text>
    </g>
