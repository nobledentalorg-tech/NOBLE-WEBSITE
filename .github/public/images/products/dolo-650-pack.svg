  </defs>
  <rect width="320" height="320" rx="48" fill="url(#bg)" />
  <g fill="#fff" opacity="0.75">
    <rect x="64" y="78" width="192" height="148" rx="28" />
    <rect x="84" y="98" width="152" height="108" rx="22" />
  </g>
  <g transform="translate(100 120)">
