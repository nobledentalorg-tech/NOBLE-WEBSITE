    <rect x="72" y="20" width="8" height="48" rx="4" fill="#ffd9e0" />
    <rect x="28" y="20" width="8" height="48" rx="4" fill="#ffd9e0" />
    <ellipse cx="44" cy="44" rx="28" ry="18" fill="url(#pill)" opacity="0.92" />
    <ellipse cx="100" cy="44" rx="28" ry="18" fill="url(#pill)" opacity="0.92" />
  </g>
  <text x="160" y="270" text-anchor="middle" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#ff4f5e">DOLO 650</text>
