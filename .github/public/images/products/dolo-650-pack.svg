<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Dolo 650 illustration</title>
  <desc id="desc">Stylised tablet blister highlighting Noble Dental Care pain relief support.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3f8" />
      <stop offset="100%" stop-color="#fde2ec" />
    </linearGradient>
    <linearGradient id="pill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a6f" />
      <stop offset="100%" stop-color="#ff4f5e" />
