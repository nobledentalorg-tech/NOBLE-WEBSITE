# Example Nginx include file to enable caching, compression, and connection hints

# Global compression
brotli on;
brotli_comp_level 5;
brotli_static on;
brotli_types text/plain text/css application/javascript application/json image/svg+xml;

gzip on;
gzip_comp_level 6;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Connection hints for critical third-party origins
add_header Link "<https://fonts.googleapis.com>; rel=preconnect; crossorigin" always;
add_header Link "<https://fonts.gstatic.com>; rel=preconnect; crossorigin" always;
add_header Link "<https://www.googletagmanager.com>; rel=preconnect" always;
add_header Link "</styles.css>; rel=preload; as=style" always;

# Cache policies
location ~* \.(js|css|svg|woff2?|ttf|png|jpe?g|gif|webp)$ {
    expires 6M;
    add_header Cache-Control "public, max-age=15552000, immutable";
}

location ~* \.(html)$ {
    expires 10m;
    add_header Cache-Control "public, max-age=600, stale-while-revalidate=86400";
}

location ~* \.(json|xml)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600, stale-if-error=86400";
}

# Security hardening
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
