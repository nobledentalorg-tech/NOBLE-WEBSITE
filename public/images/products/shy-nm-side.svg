<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Side view illustration of Shy NM toothpaste with ingredient icons</title>
  <desc id="desc">Mint green toothpaste tube laid horizontally with ingredient callouts for calcium, phosphate, and gum care.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e3fbf8"/>
      <stop offset="100%" stop-color="#f5fbff"/>
    </linearGradient>
    <linearGradient id="tubeBody" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#89ece3"/>
      <stop offset="50%" stop-color="#6dd5d3"/>
      <stop offset="100%" stop-color="#4aa5ad"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="28" fill="url(#bg)"/>
  <g transform="translate(35 140)">
    <rect width="250" height="70" rx="30" fill="url(#tubeBody)"/>
    <rect x="205" y="15" width="35" height="40" rx="10" fill="#0b696d"/>
    <rect x="-18" y="18" width="60" height="34" rx="16" fill="#ffffff" stroke="#8bd7d5" stroke-width="3"/>
    <text x="45" y="43" font-family="'Manrope',sans-serif" font-size="14" font-weight="700" fill="#0b696d" text-anchor="middle">SHY NM</text>
    <text x="140" y="45" font-family="'Manrope',sans-serif" font-size="12" font-weight="600" fill="#f7fffb" text-anchor="middle">TOOTH SENSITIVITY DEFENCE</text>
  </g>
  <g fill="#0f8a89" font-family="'Manrope',sans-serif" font-weight="600" text-anchor="middle" font-size="12">
    <circle cx="75" cy="86" r="26" fill="#ffffff" stroke="#8bd7d5" stroke-width="3"/>
    <text x="75" y="90">Ca²⁺</text>
    <circle cx="162" cy="72" r="24" fill="#ffffff" stroke="#8bd7d5" stroke-width="3"/>
    <text x="162" y="76">PO₄</text>
    <circle cx="248" cy="92" r="26" fill="#ffffff" stroke="#8bd7d5" stroke-width="3"/>
    <text x="248" y="96">Gums</text>
  </g>
  <g fill="#0f8a89" font-family="'Manrope',sans-serif" font-size="11" font-weight="600">
    <text x="75" y="130" text-anchor="middle">Remineralises</text>
    <text x="162" y="116" text-anchor="middle">Seals tubules</text>
    <text x="248" y="136" text-anchor="middle">Soothes tissues</text>
  </g>
</svg>
