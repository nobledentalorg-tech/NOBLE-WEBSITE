<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Enafix brushing routine illustration</title>
  <desc id="desc">Calendar and toothbrush graphic highlighting twice-daily Enafix usage.</desc>
  <rect width="320" height="320" rx="32" fill="#f5f5ff" />
  <g transform="translate(40 60)">
    <rect x="0" y="0" width="240" height="180" rx="24" fill="#eef2ff" stroke="#c7d2fe" stroke-width="3" />
    <rect x="0" y="0" width="240" height="48" rx="24" fill="#6366f1" />
    <text x="120" y="32" text-anchor="middle" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">Enafix Routine</text>
    <g transform="translate(24 72)">
      <g fill="#c7d2fe">
        <rect x="0" y="0" width="48" height="40" rx="12" />
        <rect x="56" y="0" width="48" height="40" rx="12" />
        <rect x="112" y="0" width="48" height="40" rx="12" />
        <rect x="168" y="0" width="48" height="40" rx="12" />
        <rect x="0" y="48" width="48" height="40" rx="12" />
        <rect x="56" y="48" width="48" height="40" rx="12" />
        <rect x="112" y="48" width="48" height="40" rx="12" />
        <rect x="168" y="48" width="48" height="40" rx="12" />
      </g>
      <g fill="#12b2a0">
        <rect x="0" y="0" width="48" height="40" rx="12" opacity="0.9" />
        <rect x="112" y="0" width="48" height="40" rx="12" opacity="0.9" />
        <rect x="56" y="48" width="48" height="40" rx="12" opacity="0.9" />
        <rect x="168" y="48" width="48" height="40" rx="12" opacity="0.9" />
      </g>
    </g>
  </g>
  <g transform="translate(70 240)">
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#12b2a0" opacity="0.15" />
    <rect x="18" y="-12" width="180" height="36" rx="18" fill="#12b2a0" />
    <text x="108" y="12" text-anchor="middle" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#fff" font-weight="700">Brush 2 minutes · Morning &amp; Night</text>
  </g>
  <g transform="translate(240 220) rotate(-20)">
    <rect x="-12" y="-60" width="24" height="120" rx="12" fill="#38bdf8" />
    <rect x="-12" y="-78" width="24" height="32" rx="12" fill="#0ea5e9" />
  </g>
</svg>
