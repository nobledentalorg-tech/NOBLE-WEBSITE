<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Enafix Tooth Paste tube illustration</title>
  <desc id="desc">Stylised Enafix toothpaste tube with teal gradient and anticay badge.</desc>
  <defs>
    <linearGradient id="tubeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7be0d6" />
      <stop offset="100%" stop-color="#12b2a0" />
    </linearGradient>
    <linearGradient id="capGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="32" fill="#ecfeff" />
  <g transform="translate(70 30)">
    <rect x="40" y="0" width="100" height="44" rx="14" fill="url(#capGradient)" />
    <rect x="18" y="40" width="144" height="220" rx="36" fill="url(#tubeGradient)" />
    <rect x="18" y="40" width="144" height="220" rx="36" fill="rgba(255,255,255,0.25)" />
    <rect x="18" y="226" width="144" height="34" rx="20" fill="#0f172a" opacity="0.12" />
    <text x="90" y="140" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="28" text-anchor="middle" fill="#0f172a" font-weight="700">Enafix</text>
    <text x="90" y="176" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0f172a">Anticay 5%</text>
  </g>
  <g transform="translate(210 210)">
    <circle cx="0" cy="0" r="54" fill="#0f172a" opacity="0.08" />
    <circle cx="0" cy="0" r="46" fill="#12b2a0" />
    <text x="0" y="6" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#fff" font-weight="700">CS+P</text>
  </g>
</svg>
