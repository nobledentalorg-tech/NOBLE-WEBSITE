<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Noble Dental Care – Nallagandla, Hyderabad</title>

  <!-- ✅ Theme & Favicon -->
  <meta name="theme-color" content="#12B2A0">
  <link rel="icon" type="image/png" href="/images/logo-footer.webp">

  <!-- ✅ SEO Meta -->
  <meta name="description" content="You're offline — Noble Dental Care remains committed to your oral health. Reconnect soon to explore treatments, book appointments, and continue your smile journey.">
  <meta name="robots" content="noindex, follow">

  <!-- ✅ Open Graph -->
  <meta property="og:title" content="Offline | Noble Dental Care – Nallagandla">
  <meta property="og:description" content="You're offline. Please reconnect to continue exploring our dental treatments and services.">
  <meta property="og:image" content="/images/logo-footer.webp">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_IN">
  <meta property="og:url" content="https://nobledentalnallagandla.in/offline.html">

  <!-- ✅ Typography & Style -->
  <style>
    :root {
      --brand: #12B2A0;
      --text: #0f172a;
      --bg: #f6fafc;
      --paper: #ffffff;
      --radius: 12px;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: "Manrope", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 24px;
    }
    img {
      width: 120px;
      margin-bottom: 20px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
    }
    h1 {
      font-size: 1.75rem;
      color: var(--brand);
      margin-bottom: 12px;
    }
    p {
      font-size: 1rem;
      max-width: 420px;
      line-height: 1.55;
      margin: 6px 0;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      border-radius: var(--radius);
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.25s ease;
    }
    a:hover {
      background: #0d6efd;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(18,178,160,0.3);
    }
    footer {
      position: absolute;
      bottom: 12px;
      font-size: 0.85rem;
      color: #64748b;
    }

    /* Responsive */
    @media (max-width: 480px) {
      h1 { font-size: 1.4rem; }
      p { font-size: 0.95rem; }
      img { width: 100px; }
    }
  </style>
</head>
<body>
  <img src="/images/logo-footer.webp" alt="Noble Dental Care Logo" loading="lazy">
  <h1>You're Offline</h1>
  <p>It seems your internet connection is lost. Don’t worry — we’ll be right here when you’re back online.</p>
  <p>Try reconnecting or revisit our homepage once you’re connected.</p>
  <a href="/">🔁 Go to Homepage</a>

  <footer>© 2025 Noble Dental Care – Nallagandla</footer>
</body>
</html>
